[project]
name = "dw-host"
version = "0.1.0"
description = "DataWorkbench Python sidecar (JSON-RPC host)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dw_host*", "dw_workflow*", "dw_nodes_system*", "dw_nodes_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
