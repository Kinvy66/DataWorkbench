appId: org.daworkbench.desktop
productName: DataWorkbench
copyright: Copyright (c) 2026 DataWorkbench contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../python
    to: python
    filter:
      - '**/*'
      - '!.venv/**'
      - '!tests/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!**/.pytest_cache/**'
      - '!pytest.xml'
  - from: resources/python-runtime
    to: python-runtime
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../NOTICE
    to: NOTICE.txt
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/portable-readme.txt
    to: README.txt
asar: true
npmRebuild: false
compression: maximum
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DataWorkbench
  uninstallDisplayName: DataWorkbench
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerLanguages:
    - zh_CN
    - en_US
  displayLanguageSelector: false
  license: ../LICENSE
  artifactName: ${productName}-Setup-${version}.${ext}
